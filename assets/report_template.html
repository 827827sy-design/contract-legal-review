<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
:root{
  --c-high:#c5221f; --c-high-bg:#fce8e6;
  --c-med:#b06000;  --c-med-bg:#fef1e0;
  --c-low:#1a56b0;  --c-low-bg:#e8f0fe;
  --c-rev:#5f6368;  --c-rev-bg:#f1f3f4;
  --c-cur:#ffe94d;  --c-cur-border:#b8860b;
  --bd:#dadce0; --tx:#202124; --tx2:#5f6368; --bg:#ffffff; --panel:#f8f9fa;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;font-size:14px}
#topbar{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--bd);
  padding:10px 16px}
#topbar h1{font-size:17px;margin:0 0 4px}
#topbar .meta{color:var(--tx2);font-size:12px;line-height:1.7}
.banner{margin-top:6px;padding:6px 10px;border-radius:6px;font-size:12.5px;line-height:1.6}
.banner.warn{background:#fef7e0;border:1px solid #f9ab00}
.banner.err{background:var(--c-high-bg);border:1px solid var(--c-high)}
.banner.info{background:var(--c-low-bg);border:1px solid var(--c-low)}
#layout{display:flex;align-items:flex-start;gap:0}
#left{width:65%;height:calc(100vh - 96px);overflow-y:auto;padding:18px 24px 60px;
  border-right:1px solid var(--bd)}
#right{width:35%;height:calc(100vh - 96px);overflow-y:auto;padding:12px 14px 60px;background:var(--panel)}
/* ---- 合同原文 ---- */
.doc-title{font-size:18px;font-weight:700;text-align:center;margin:6px 0 14px}
.blk{margin:0 0 8px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.blk-heading{font-weight:700;margin-top:14px}
.blk-table{white-space:normal;border-collapse:collapse;margin:8px 0;width:100%}
.blk-table td,.blk-table th{border:1px solid var(--bd);padding:4px 8px;line-height:1.7;vertical-align:top}
.blk-table tr:nth-child(1) td{background:#f5f6f7;font-weight:600}
.blkno{color:#9aa0a6;font-size:10px;user-select:none;margin-right:6px;vertical-align:top}
/* ---- 风险标记 ---- */
.mk{border-radius:2px;padding:0 1px;cursor:pointer}
.mk-high{box-shadow:inset 0 -2.5px 0 var(--c-high-bg);border-bottom:2px solid var(--c-high)}
.mk-medium{box-shadow:inset 0 -2.5px 0 var(--c-med-bg);border-bottom:2px solid var(--c-med)}
.mk-low{box-shadow:inset 0 -2.5px 0 var(--c-low-bg);border-bottom:2px solid var(--c-low)}
.mk-review_required{box-shadow:inset 0 -2.5px 0 var(--c-rev-bg);border-bottom:2px dashed var(--c-rev)}
.mk-active{background:#fff6b8}
.mk-current{background:var(--c-cur);outline:2px solid var(--c-cur-border);outline-offset:1px}
.srch-hit{background:#a8dab5;outline:1px solid #188038}
/* ---- 右侧面板 ---- */
.toolbar{position:sticky;top:-12px;background:var(--panel);padding:8px 0;z-index:10;
  border-bottom:1px solid var(--bd);margin-bottom:10px}
.toolbar input[type=search]{width:100%;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;
  font-size:13px;margin-bottom:8px}
.frow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.fchip{border:1px solid var(--bd);background:#fff;border-radius:14px;padding:2px 10px;font-size:12px;
  cursor:pointer;user-select:none}
.fchip.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.fchip.sev-high.on{background:var(--c-high);border-color:var(--c-high)}
.fchip.sev-medium.on{background:var(--c-med);border-color:var(--c-med)}
.fchip.sev-low.on{background:var(--c-low);border-color:var(--c-low)}
.fchip.sev-review_required.on{background:var(--c-rev);border-color:var(--c-rev)}
.stats{font-size:12px;color:var(--tx2);margin:6px 0}
.card{border:1px solid var(--bd);border-radius:8px;background:#fff;margin-bottom:10px;overflow:hidden}
.card.sel{border-color:var(--c-cur-border);box-shadow:0 0 0 2px #f5e6a3}
.card-head{padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.card-head .rid{font-weight:700;color:var(--tx2);font-size:12px;margin-top:2px;min-width:38px}
.card-head .ttl{flex:1;font-weight:600;line-height:1.5}
.badge{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;margin-left:4px;
  vertical-align:1px;white-space:nowrap}
.badge.high{background:var(--c-high-bg);color:var(--c-high)}
.badge.medium{background:var(--c-med-bg);color:var(--c-med)}
.badge.low{background:var(--c-low-bg);color:var(--c-low)}
.badge.review_required{background:var(--c-rev-bg);color:var(--c-rev)}
.badge.cat{background:#e8eaed;color:#3c4043}
.badge.v-verified{background:#e6f4ea;color:#137333}
.badge.v-basis_unverified,.badge.v-evidence_unverified,.badge.v-partial{background:#fef7e0;color:#b06000}
.badge.v-review_required{background:var(--c-rev-bg);color:var(--c-rev)}
.card-body{display:none;padding:4px 14px 12px;border-top:1px dashed var(--bd);font-size:13px}
.card.open .card-body{display:block}
.sec{margin-top:10px}
.sec h4{margin:0 0 4px;font-size:12.5px;color:var(--tx2);font-weight:600}
.sec .body{line-height:1.75;white-space:pre-wrap;word-break:break-word}
.ev{border-left:3px solid var(--bd);padding:4px 10px;margin:6px 0;background:#fafafa;border-radius:0 6px 6px 0}
.ev.cur{border-left-color:var(--c-cur-border);background:#fffbe6}
.ev .loc{font-size:11px;color:var(--tx2);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev .q{line-height:1.7;word-break:break-word;white-space:pre-wrap}
.ev .note{font-size:11.5px;color:#b06000;margin-top:3px}
.evlink{cursor:pointer;color:var(--c-low);font-size:11px;text-decoration:underline;background:none;border:none;padding:0}
.law{border:1px solid var(--bd);border-radius:6px;padding:6px 10px;margin:6px 0;background:#fff}
.law .cite{font-weight:600;margin-bottom:3px}
.law .ltxt{color:#3c4043;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.law .vstat{font-size:11.5px;margin-top:4px}
.law .vstat.ok{color:#137333}.law .vstat.bad{color:var(--c-high)}.law .vstat.warn{color:#b06000}
ul.checks{margin:4px 0;padding-left:20px;line-height:1.8}
.proposed{background:#f0f7f0;border:1px dashed #34a853;border-radius:6px;padding:6px 10px;
  line-height:1.7;white-space:pre-wrap;word-break:break-word}
.empty{color:var(--tx2);padding:30px 10px;text-align:center}
.btnrow{display:flex;gap:8px;margin-top:6px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer}
.btn:hover{background:#f1f3f4}
/* ---- 打印 ---- */
#print-only{display:none}
@media print{
  #topbar{position:static}
  #right,.toolbar{display:none}
  #layout{display:block}
  #left{width:100%;height:auto;overflow:visible;border:none;padding:0}
  .mk{background:none!important;outline:none!important;box-shadow:none!important;
    border-bottom:1.5px solid #666}
  #print-only{display:block;margin-top:24px;page-break-before:always}
  #print-only table{border-collapse:collapse;width:100%;font-size:12px}
  #print-only td,#print-only th{border:1px solid #999;padding:4px 6px;line-height:1.6;vertical-align:top}
  #print-only h2{font-size:15px}
}
</style>
</head>
<body>
<div id="topbar">
  <h1 id="docTitle">__TITLE__</h1>
  <div class="meta" id="metaLine"></div>
  <div id="banners">__BANNERS_HTML__</div>
</div>
<div id="layout">
  <div id="left">
    <div id="contractRoot">__CONTRACT_HTML__</div>
  </div>
  <div id="right">
    <div class="toolbar">
      <input type="search" id="kw" placeholder="关键词搜索合同原文，回车定位，可连续按 F3 式下一个">
      <div class="btnrow">
        <button class="btn" id="kwPrev">上一个</button>
        <button class="btn" id="kwNext">下一个</button>
        <button class="btn" id="kwClear">清除</button>
        <button class="btn" id="btnPrint">打印</button>
        <button class="btn" id="btnExpand">全部展开</button>
      </div>
      <div class="frow" id="sevFilter"></div>
      <div class="frow" id="catFilter"></div>
      <div class="stats" id="stats"></div>
    </div>
    <div id="cards"></div>
    <div class="empty" id="noResult" style="display:none">无符合筛选条件的风险</div>
  </div>
</div>
<div id="print-only">__PRINT_SUMMARY_HTML__</div>
<script>
"use strict";
const DATA = __DATA_JSON__;
const SEV_LABEL = {high:"高风险",medium:"中风险",low:"低风险",review_required:"待核实"};
const V_LABEL = {verified:"已核验",basis_unverified:"法律依据待核实",evidence_unverified:"原文定位待核实",
  partial:"部分核验",review_required:"需人工核实"};
function esc(s){if(s===null||s===undefined)return "";return String(s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
const $ = s=>document.querySelector(s);
const leftEl = $("#left");

/* ---------- 状态 ---------- */
const state = {sev:new Set(),cat:new Set(),selected:null,curEv:0,kwHits:[],kwIdx:-1};

/* ---------- 筛选器 ---------- */
function buildFilters(){
  const sevBox=$("#sevFilter"),catBox=$("#catFilter");
  sevBox.innerHTML='<span class="fchip on" data-sev="*">全部等级</span>'+
    ["high","medium","low","review_required"].map(s=>
      `<span class="fchip sev-${s} on" data-sev="${s}">${SEV_LABEL[s]} ${countSev(s)}</span>`).join("");
  const cats=DATA.meta.categories_used||[];
  catBox.innerHTML='<span class="fchip on" data-cat="*">全部类型</span>'+
    cats.map(c=>`<span class="fchip on" data-cat="${esc(c)}">${esc(c)} ${countCat(c)}</span>`).join("");
  cats.forEach(c=>state.cat.add(c));
  ["high","medium","low","review_required"].forEach(s=>state.sev.add(s));
  sevBox.querySelectorAll(".fchip").forEach(ch=>ch.addEventListener("click",()=>{
    const v=ch.dataset.sev;
    if(v==="*"){const all=state.sev.size===4;state.sev=new Set(["high","medium","low","review_required"]);
      if(all)state.sev.clear();
      sevBox.querySelectorAll(".fchip[data-sev]").forEach(x=>{if(x.dataset.sev!=="*")
        x.classList.toggle("on",state.sev.has(x.dataset.sev));});}
    else{state.sev.has(v)?state.sev.delete(v):state.sev.add(v);ch.classList.toggle("on",state.sev.has(v));}
    renderCards();}));
  catBox.querySelectorAll(".fchip").forEach(ch=>ch.addEventListener("click",()=>{
    const v=ch.dataset.cat;
    if(v==="*"){const allCats=cats.every(c=>state.cat.has(c));
      state.cat=new Set(allCats?[]:cats);
      catBox.querySelectorAll(".fchip[data-cat]").forEach(x=>{if(x.dataset.cat!=="*")
        x.classList.toggle("on",state.cat.has(x.dataset.cat));});}
    else{state.cat.has(v)?state.cat.delete(v):state.cat.add(v);ch.classList.toggle("on",state.cat.has(v));}
    renderCards();}));
}
function countSev(s){return DATA.risks.filter(r=>r.severity===s).length;}
function countCat(c){return DATA.risks.filter(r=>r.category===c).length;}

/* ---------- 风险卡片 ---------- */
function evidenceHtml(r,ev){
  const i=ev.i;
  let loc=ev.has_span?`定位：${esc(ev.pos_desc||ev.block_id||"原文")}`:"";
  if(ev.no_text)loc=ev.pos_desc||"无直接原文";
  if(!ev.has_span&&!ev.no_text)loc=ev.pos_desc||"未能定位";
  return `<div class="ev" id="ev-${r.risk_id}-${i}" data-rid="${r.risk_id}" data-i="${i}">
    <div class="loc"><b>证据${i+1}</b> <span>${loc}</span>
      ${ev.has_span?`<button class="evlink" data-goto="${r.risk_id}:${i}">滚动定位</button>`:""}
    </div>
    ${ev.quote?`<div class="q">“${esc(ev.quote)}”</div>`:""}
    ${ev.note?`<div class="note">${esc(ev.note)}</div>`:""}
  </div>`;
}
function basisHtml(b){
  const vcls=b.status==="verified"?"ok":(b.status==="not_found"||b.status==="mismatch")?"bad":"warn";
  let vtxt;
  if(b.status==="verified")vtxt="✔ 条号与条文已对照知识库核验一致";
  else if(b.status==="not_found")vtxt="✘ 所引法条未在知识库中找到（"+esc(b.note)+"）——不得作为审查依据，需人工核实";
  else if(b.status==="mismatch")vtxt="✘ 所引条文与知识库该条号原文不一致——不得作为审查依据，需人工核实";
  else if(b.status==="kb_incomplete")vtxt="⚠ "+esc(b.note);
  else vtxt=esc(b.status);
  const showText=b.status==="mismatch"?
    `引用文本：“${esc(b.cited_text)}”<br>知识库原文：“${esc(b.kb_text||"（该条号不存在）")}”`:
    esc(b.kb_text||b.cited_text||"");
  return `<div class="law">
    <div class="cite">${esc(b.law_name||b.law_id)}（${esc(b.version||"")}）${esc(b.article_no)}</div>
    <div class="ltxt">${showText}</div>
    <div class="vstat ${vcls}">${vtxt}</div>
  </div>`;
}
function cardHtml(r){
  const v=r.verification_status||{};
  const vstat=v.overall||"review_required";
  return `<div class="card" id="card-${r.risk_id}" data-rid="${r.risk_id}" data-sev="${r.severity}" data-cat="${esc(r.category)}">
    <div class="card-head">
      <span class="rid">${r.risk_id}</span>
      <span class="ttl">${esc(r.title)}
        <span class="badge ${r.severity}">${SEV_LABEL[r.severity]||r.severity}</span>
        <span class="badge cat">${esc(r.category)}</span>
        <span class="badge v-${vstat}">${V_LABEL[vstat]||vstat}</span>
      </span>
    </div>
    <div class="card-body">
      ${r.conclusion?`<div class="sec"><h4>风险判断</h4><div class="body">${esc(r.conclusion)}</div></div>`:""}
      ${r.explanation?`<div class="sec"><h4>具体原因</h4><div class="body">${esc(r.explanation)}</div></div>`:""}
      <div class="sec"><h4>原文证据（点击“滚动定位”或风险标题可跳转）</h4>
        ${r.evidence&&r.evidence.length?r.evidence.map(ev=>evidenceHtml(r,ev)).join("")
          :`<div class="note" style="color:#5f6368">本条无原文证据</div>`}
      </div>
      ${r.legal_basis&&r.legal_basis.length?`<div class="sec"><h4>法律依据</h4>${r.legal_basis.map(basisHtml).join("")}</div>`
        :`<div class="sec"><h4>法律依据</h4><div class="body" style="color:#5f6368">未引用具体法条${r.scope_note?"（"+esc(r.scope_note)+"）":""}</div></div>`}
      ${r.recommendation?`<div class="sec"><h4>修改/补充建议</h4><div class="body">${esc(r.recommendation)}</div></div>`:""}
      ${r.proposed_clause?`<div class="sec"><h4>建议条款示例</h4><div class="proposed">${esc(r.proposed_clause)}</div></div>`:""}
      ${r.manual_checks&&r.manual_checks.length?`<div class="sec"><h4>人工核实事项</h4><ul class="checks">${
        r.manual_checks.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`:""}
    </div>
  </div>`;
}
function renderCards(){
  const box=$("#cards");
  const list=DATA.risks.filter(r=>state.sev.has(r.severity)&&state.cat.has(r.category));
  box.innerHTML=list.map(cardHtml).join("");
  $("#noResult").style.display=list.length?"none":"block";
  $("#stats").textContent=`显示 ${list.length} / ${DATA.risks.length} 条风险`;
  box.querySelectorAll(".card-head").forEach(h=>h.addEventListener("click",e=>{
    if(e.target.classList.contains("evlink"))return;
    const rid=h.parentElement.dataset.rid;
    const card=h.parentElement;
    if(state.selected===rid&&card.classList.contains("open")){
      card.classList.remove("open");clearMarks();state.selected=null;return;}
    selectRisk(rid,0);}));
  box.querySelectorAll(".evlink").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation();
    const [rid,i]=b.dataset.goto.split(":");
    selectRisk(rid,parseInt(i,10));}));
  if(state.selected)markCardSelected(state.selected);
}

/* ---------- 高亮与定位 ---------- */
function evSpans(rid,i){return document.querySelectorAll(".m-"+rid+"-"+i);}
function clearMarks(){
  document.querySelectorAll(".mk-active,.mk-current").forEach(el=>
    el.classList.remove("mk-active","mk-current"));
  document.querySelectorAll(".ev.cur").forEach(el=>el.classList.remove("cur"));
  document.querySelectorAll(".card.sel").forEach(el=>el.classList.remove("sel"));
}
function markCardSelected(rid){
  const card=document.getElementById("card-"+rid);
  if(card){card.classList.add("sel");card.classList.add("open");}
}
function selectRisk(rid,evIdx){
  const r=DATA.risks.find(x=>x.risk_id===rid);
  if(!r)return;
  clearMarks();
  state.selected=rid;
  /* 该风险全部证据加 active（浅黄），当前证据加 current（亮黄+边框） */
  let scrolled=false;
  r.evidence.forEach(ev=>{
    const spans=evSpans(rid,ev.i);
    spans.forEach(s=>s.classList.add("mk-active"));
    if(ev.i===evIdx){
      spans.forEach(s=>s.classList.add("mk-current"));
      const evBox=document.getElementById("ev-"+rid+"-"+ev.i);
      if(evBox)evBox.classList.add("cur");
      if(!scrolled&&spans.length){
        spans[0].scrollIntoView({behavior:"smooth",block:"center"});
        scrolled=true;}
    }
  });
  state.curEv=evIdx;
  markCardSelected(rid);
  const card=document.getElementById("card-"+rid);
  if(card)card.scrollIntoView({behavior:"smooth",block:"nearest"});
}
/* 点击左侧原文标记 -> 选中对应风险 */
$("#contractRoot").addEventListener("click",e=>{
  const t=e.target;
  if(!t.classList||!t.classList.contains("mk"))return;
  for(const c of t.classList){
    const m=c.match(/^m-(R\d+)-(\d+)$/);
    if(m){selectRisk(m[1],parseInt(m[2],10));return;}
  }
});

/* ---------- 关键词搜索 ---------- */
function clearKw(){
  document.querySelectorAll("mark.srch-hit").forEach(mk=>{
    const p=mk.parentNode;mk.replaceWith(document.createTextNode(mk.textContent));p.normalize();});
  state.kwHits=[];state.kwIdx=-1;
}
function doSearch(){
  clearKw();
  const kw=$("#kw").value.trim();
  if(!kw)return;
  const walker=document.createTreeWalker($("#contractRoot"),NodeFilter.SHOW_TEXT);
  const nodes=[];let n;
  while((n=walker.nextNode()))nodes.push(n);
  for(const node of nodes){
    const text=node.nodeValue;let idx=text.indexOf(kw);
    if(idx<0)continue;
    const frag=document.createDocumentFragment();let last=0;
    while(idx>=0){
      frag.appendChild(document.createTextNode(text.slice(last,idx)));
      const mk=document.createElement("mark");mk.className="srch-hit";
      mk.textContent=text.slice(idx,idx+kw.length);
      frag.appendChild(mk);
      last=idx+kw.length;idx=text.indexOf(kw,last);
    }
    frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag,node);
  }
  state.kwHits=[...document.querySelectorAll("mark.srch-hit")];
  state.kwIdx=-1;
  if(state.kwHits.length)nextHit();
  updateStats();
}
function nextHit(){
  if(!state.kwHits.length)return;
  state.kwIdx=(state.kwIdx+1)%state.kwHits.length;gotoHit();}
function prevHit(){
  if(!state.kwHits.length)return;
  state.kwIdx=(state.kwIdx-1+state.kwHits.length)%state.kwHits.length;gotoHit();}
function gotoHit(){
  const h=state.kwHits[state.kwIdx];
  h.scrollIntoView({behavior:"smooth",block:"center"});updateStats();}
function updateStats(){
  const el=$("#stats");
  const list=DATA.risks.filter(r=>state.sev.has(r.severity)&&state.cat.has(r.category));
  let t=`显示 ${list.length} / ${DATA.risks.length} 条风险`;
  if($("#kw").value.trim())t+=` ｜ 关键词命中 ${state.kwHits.length} 处`+
    (state.kwHits.length?`（第 ${state.kwIdx+1} 处）`:"");
  el.textContent=t;}

/* ---------- 初始化 ---------- */
function initMeta(){
  const m=DATA.meta;
  $("#metaLine").innerHTML=
    `合同文件：${esc(m.source_name)} ｜ 合同类型：${esc(m.contract_type||"未识别")} ｜ `+
    `审查时间：${esc(m.reviewed_at)} ｜ 解析状态：${esc(m.parse_status)}<br>`+
    `审查依据：${esc((m.law_scope||[]).map(l=>l.law_name+"（"+l.version+"）").join("；"))}<br>`+
    `风险统计：${["high","medium","low","review_required"].map(s=>
      `${SEV_LABEL[s]} ${DATA.risks.filter(r=>r.severity===s).length}`).join(" ｜ ")}`+
    (m.scope_limitation?`<br>审查局限：${esc(m.scope_limitation)}`:"");
}
$("#kw").addEventListener("keydown",e=>{if(e.key==="Enter"){e.shiftKey?prevHit():nextHitOrSearch();}});
function nextHitOrSearch(){if(state.kwHits.length)nextHit();else doSearch();}
$("#kw").addEventListener("input",()=>{if(!$("#kw").value.trim()){clearKw();updateStats();}});
$("#kwNext").addEventListener("click",()=>nextHitOrSearch());
$("#kwPrev").addEventListener("click",prevHit);
$("#kwClear").addEventListener("click",()=>{$("#kw").value="";clearKw();updateStats();});
$("#btnPrint").addEventListener("click",()=>window.print());
$("#btnExpand").addEventListener("click",e=>{
  const cards=document.querySelectorAll(".card");
  const anyClosed=[...cards].some(c=>!c.classList.contains("open"));
  cards.forEach(c=>c.classList.toggle("open",anyClosed));
  e.target.textContent=anyClosed?"全部收起":"全部展开";});
initMeta();buildFilters();renderCards();
</script>
</body>
</html>
